[project]
name = "hackyeah-backend"
version = "0.1.0"
description = "Backend: dane o dostępności, routing dla wózków, zgłoszenia użytkowników"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "networkx>=3.3",
    "osmnx>=2.0",
    "tifffile>=2025.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
