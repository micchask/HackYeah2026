# Konfiguracja miasta. Nowe miasto = nowy plik w tym katalogu (bez if-ów w kodzie).
id: krakow
name: Kraków
country: PL
timezone: Europe/Warsaw

# [south, west, north, east] w WGS84
bbox: [49.97, 19.79, 50.13, 20.22]
center: [50.0614, 19.9366]
# Obszar demo: Stare Miasto, Wawel, Kazimierz (docs/demo-scenario.md)
demo_bbox: [50.045, 19.928, 50.066, 19.950]
default_zoom: 13

# Kolejność ma znaczenie: przy konfliktach wyżej = większe zaufanie bazowe
# (patrz app/normalization/merge.py). Każdy wpis to klasa z app/providers/.
providers:
  - name: osm
    enabled: true
    options:
      # overpass-api.de odrzuca połączenia (3.10.2026) - ten sam mirror co routing
      overpass_url: https://maps.mail.ru/osm/tools/overpass/api/interpreter
      timeout_s: 60

  # Deklaracje dostępności podmiotów publicznych (BIP) - wzór obowiązkowy w całej Polsce,
  # więc inne miasto = inny plik/URL tutaj. Licencja: informacja publiczna (docs/data-sources.md).
  - name: accessibility_declarations
    enabled: true
    options:
      url: datasets/krakow_instytucje_dostepnosc.json # ścieżka względem backend/ albo http(s)://
      # kategoria w deklaracji -> cecha; tekst zamieniany na tak/nie wg słów (bez polskich znaków
      # też pasuje). Najpierw "negative", potem "positive"; tekst bez dopasowania jest pomijany.
      attributes:
        winda:
          key: elevator
          negative: [brak]
          positive: [tak, dostosowan, windy osobowe]
        toaleta:
          key: accessible_toilet
          negative: [brak]
          positive: [dostepn, dostosowan]
        wejscie: &entrance
          key: step_free_entrance
          negative: [schod, stopni, stopien]
          positive: [bez barier, z poziomu, dostosowan]
        wejscie_glowne: *entrance
        wejscie_boczne: *entrance

  - name: krakow_open_data
    enabled: false # TODO(dane): uzupełnić URL-e zbiorów z portalu otwartych danych Krakowa
    options:
      datasets: []

  - name: msip
    enabled: false # TODO(dane): MSIP Kraków (WMS/WFS) - warstwy chodników, przejść, schodów
    options:
      wfs_url: ""
      layers: []

  - name: user_reports
    enabled: true
    options: {}

  # Ręczne uzupełnienia (data/seed/krakow/manual.json.gz), np. miejsca ze sceny 4 demo
  - name: manual
    enabled: true
    options: {}

routing:
  # Graf pieszy z OSM (osmnx), cache'owany w data/cache/<city>/graph.graphml
  network_type: walk
  # overpass-api.de bywa niedostępny; mirror sprawdzony 3.10.2026
  overpass_url: https://maps.mail.ru/osm/tools/overpass/api/interpreter
