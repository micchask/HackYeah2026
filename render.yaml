# Render Blueprint: baza PostGIS + backend (Docker) + frontend (strona statyczna), wszystko "free".
# Instrukcja: docs/deploy-render.md. Lokalny docker compose działa bez zmian.

databases:
  - name: kbb-db
    plan: free
    databaseName: app
    user: app

services:
  - type: web
    name: kbb-backend
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile.render
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kbb-db
          property: connectionString
      - key: DB_ENABLED
        value: "true"
      - key: DEFAULT_CITY
        value: krakow

  - type: web
    name: kbb-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Frontend woła /api/... (lokalnie robi to proxy Vite) - tu przekazuje to backendowi.
      # Jeśli Render nada backendowi inny adres niż kbb-backend.onrender.com, popraw go tutaj.
      - type: rewrite
        source: /api/*
        destination: https://kbb-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
