services:
  db:
    # Multi-arch build PostGIS (oficjalny postgis/postgis nie ma obrazu arm64 dla Apple Silicon)
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@db:5432/app}
      DB_ENABLED: ${DB_ENABLED:-true}
      DEFAULT_CITY: ${DEFAULT_CITY:-krakow}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173"]}'
      DATA_DIR: /data
      # Hot reload działa też na Windows (bind mount nie przekazuje zdarzeń plików)
      WATCHFILES_FORCE_POLLING: ${FILE_POLLING:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app # hot reload
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: ${FILE_POLLING:-true}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app # hot reload
      - /app/node_modules # node_modules z obrazu, nie z hosta
    depends_on:
      - backend

volumes:
  pgdata:
